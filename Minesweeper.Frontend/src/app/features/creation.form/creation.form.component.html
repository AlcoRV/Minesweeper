<form [formGroup]="form" (ngSubmit)="onSubmit()" class="bg-white p-6 rounded-lg shadow-md flex flex-col gap-4">
    <div class="flex flex-col">
      <label for="width" class="text-gray-700 font-semibold">Ширина:</label>
      <input id="width" formControlName="width" type="number"
             class="border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
    </div>
  
    <div class="flex flex-col">
      <label for="height" class="text-gray-700 font-semibold">Высота:</label>
      <input id="height" formControlName="height" type="number"
             class="border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
    </div>
  
    <div class="flex flex-col">
      <label for="minesCount" class="text-gray-700 font-semibold">Количество мин:</label>
      <input id="minesCount" formControlName="minesCount" type="number"
             class="border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
    </div>
  
    <button type="submit" [disabled]="form.invalid"
            class="mt-4 bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 transition disabled:bg-gray-400">
      Сгенерировать
    </button>
  </form>
