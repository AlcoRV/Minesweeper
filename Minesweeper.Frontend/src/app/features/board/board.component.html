<div *ngIf="boardData?.field" class="grid gap-1 bg-gray-100 p-4 rounded-lg shadow-md">
    <div *ngFor="let row of boardData!.field; index as i" class="flex">
      <span *ngFor="let it of row; index as j"
            class="w-10 h-10 flex items-center justify-center border border-gray-400 
                   text-lg font-semibold cursor-pointer select-none 
                   transition hover:bg-gray-200 active:bg-gray-300"
            [ngClass]="{
              'text-blue-500': it === '1',
              'text-green-500': it === '2',
              'text-red-500': it === '3',
              'text-purple-500': it === '4',
              'text-orange-500': it === '5',
              'text-pink-500': it === '6',
              'text-teal-500': it === '7',
              'text-yellow-500': it === '8',
              'bg-gray-300': it === ' ',
              'bg-red-500 text-white': it === 'X',
              'bg-green-500 text-white': it === 'M'
            }"
            (click)="makeTurn(i, j)">
        {{ it !== '0' && it !== ' ' ? it : '' }}
      </span>
    </div>
  </div>
